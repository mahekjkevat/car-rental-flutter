name: car_rental_admin
description: "A Car Rental Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.7.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Flutter Core: Essential packages for Flutter applications
  cupertino_icons: # iOS-style icons for Flutter

  # Firebase Services: Packages for Firebase integration
  firebase_core: # Core Firebase SDK
  cloud_firestore: # Firestore for NoSQL database
  firebase_auth: # Firebase Authentication
  firebase_app_check: # App Check for security

  # UI/UX: Packages for UI components and styling
  google_fonts: # Google Fonts for typography
  smooth_page_indicator: # Page indicator for carousels
  carousel_slider: # Carousel slider for images
  cached_network_image: # Caching for network images
  flutter_swiper_null_safety: # Swiper for sliding UI

  # Image Handling: Packages for image picking and processing
  image_picker: # Image selection from gallery/camera
  image_cropper: # Image cropping functionality
  permission_handler:

  # Connectivity: Network and connectivity monitoring
  connectivity_plus: # Network connectivity status
  fluttertoast: # Toast notifications

  # Charts: Data visualization packages
  fl_chart: # Charts and graphs for Flutter
  syncfusion_flutter_charts:

  # Storage: Local and cloud storage solutions
  shared_preferences: # Local key-value storage
  appwrite: # Appwrite for backend services

  # Maps: Location and map-related packages
  flutter_map: # Map widget for Flutter
  geolocator: # Location services
  geocoding: # Geocoding and reverse geocoding
  latlong2:

  http:
  pdf:
  printing:
  path_provider:
  open_file:
  flutter_local_notifications:
  firebase_messaging:


  animate_do:
  audioplayers:
dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting and code quality
  flutter_lints: # Recommended lints for Flutter

  # Launcher icon generation
  flutter_launcher_icons:  # Generate app launcher icons

  mailer:

flutter:
  uses-material-design: true

  assets:
    - assets/images/ # Includes app_logo.png and other images
    - assets/music/ # Includes app_logo.png and other images
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto.ttf
        - asset: assets/fonts/Roboto-Bold.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_logo.jpeg"