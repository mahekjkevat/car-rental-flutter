name: mahek_cafe
description: "A mahek_cafe Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.7.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons:
  google_fonts:
  firebase_core:
  fluttertoast:
  cloud_firestore:
  firebase_auth:
  cached_network_image:
  flutter_staggered_animations:
  mailer:
  flutter_launcher_icons: ^0.13.1
  url_launcher:
  pusher_channels_flutter:

  razorpay_flutter: ^1.3.7

  # NEW Location and Maps Dependencies:
  geolocator:
  geocoding:
  flutter_map:
  latlong2:
  uuid:
  connectivity_plus:
  order_tracker_zen:

  speech_to_text:

  parse_server_sdk:
  image_picker:
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.jpeg"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/app_icon.jpeg"
    background_color: "#F96D0A"
    theme_color: "#F96D0A"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/avatar/
